version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petly-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - pgsql
    networks:
      - petly-net

  web:
    image: nginx:stable
    container_name: petly-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - petly-net

  pgsql:
    image: postgres:15
    container_name: petly-db
    environment:
      POSTGRES_DB: gp247
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_clave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - petly-net

volumes:
  pgdata:

networks:
  petly-net:

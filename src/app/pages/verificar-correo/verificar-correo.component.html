<div class="verificacion-container">
  <h2>Verifica tu correo electrónico</h2>

  <p>Hemos enviado un código a: <strong>{{ correo }}</strong></p>
  <p>Ingresa el código de 6 dígitos que recibiste para continuar.</p>

  <form [formGroup]="verificarForm" (ngSubmit)="verificar()">
    <label for="codigo">Código de verificación:</label>
    <input id="codigo" type="text" formControlName="codigo" maxlength="6" />

    <div *ngIf="verificarForm.get('codigo')?.invalid && verificarForm.get('codigo')?.touched" class="error">
      El código es obligatorio y debe tener 6 dígitos.
    </div>

    <button type="submit" [disabled]="verificarForm.invalid">Verificar</button>
  </form>

  <div *ngIf="mensaje" class="success">{{ mensaje }}</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>

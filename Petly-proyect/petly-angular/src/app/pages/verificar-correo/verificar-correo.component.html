<div class="petly-container">
  <img src="assets/logo.png" alt="Petly" class="petly-logo" />
  <h2 class="petly-titulo">Verifica tu correo electrónico</h2>

  <p class="petly-texto">Hemos enviado un código a: <strong>{{ correo }}</strong></p>
  <p class="petly-texto">Ingresa el código de 6 dígitos que recibiste para continuar.</p>

  <form [formGroup]="verificarForm" (ngSubmit)="verificar()" class="petly-form">
    <div class="petly-form-group">
      <label class="petly-label" for="codigo">Código de verificación</label>
      <input
        id="codigo"
        type="text"
        formControlName="codigo"
        maxlength="6"
        class="petly-input"
        placeholder="123456"
      />

      <div *ngIf="verificarForm.get('codigo')?.invalid && verificarForm.get('codigo')?.touched" class="petly-error">
        El código es obligatorio y debe tener 6 dígitos.
      </div>
    </div>

    <button type="submit" [disabled]="verificarForm.invalid" class="petly-boton">
      Verificar
    </button>
  </form>

  <div *ngIf="mensaje" class="petly-success">{{ mensaje }}</div>
  <div *ngIf="error" class="petly-error">{{ error }}</div>
</div>

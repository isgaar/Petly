<div class="petly-container">
  <h2 class="petly-titulo">Administrar productos</h2>
  <button routerLink="/admin/categorias" class="petly-boton-link">🔗 Ir a categorías</button>
  <button routerLink="/admin" class="petly-boton-link">🔗 Ir a Admin</button>
  <!-- Formulario de agregar/editar producto -->
  <div *ngIf="mostrarFormulario">
    <h3 class="petly-subtitulo">{{ editandoProducto ? 'Editar producto' : 'Registrar nuevo producto' }}</h3>
    <form [formGroup]="productoForm" (ngSubmit)="guardarProducto()" enctype="multipart/form-data">

      <label class="petly-label">Nombre</label>
      <input type="text" formControlName="nombre" class="petly-input" />

      <label class="petly-label">Tipo</label>
      <select formControlName="tipo" class="petly-input">
        <option value="" disabled selected>Selecciona tipo</option>
        <option *ngFor="let categoria of categorias" [value]="categoria.nombre">{{ categoria.nombre }}</option>
      </select>

      <label class="petly-label">Descripción</label>
      <textarea formControlName="descripcion" class="petly-input"></textarea>

      <label class="petly-label">Precio</label>
      <input type="number" formControlName="precio" class="petly-input" />

      <label class="petly-label">Imagen del producto</label>
      <input type="file" (change)="onFileChange($event)" class="petly-input" accept="image/*" />

      <button type="submit" [disabled]="productoForm.invalid" class="petly-boton">
        {{ editandoProducto ? 'Actualizar producto' : 'Agregar producto' }}
      </button>
    </form>

    <div *ngIf="mensaje" class="success">{{ mensaje }}</div>
    <div *ngIf="error" class="petly-error">{{ error }}</div>
  </div>

  <!-- Tabla de productos -->
  <div *ngIf="!mostrarFormulario">
    <div class="petly-busqueda">
      <input [(ngModel)]="filtro" placeholder="Buscar por nombre o tipo" class="petly-input" />
    </div>

    <table class="petly-tabla">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Tipo</th>
          <th>Precio</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of productosFiltrados">
          <td>{{ producto.nombre }}</td>
          <td>{{ producto.descripcion }}</td>
          <td>{{ producto.tipo }}</td>
          <td>${{ producto.precio }}</td>
          <td>
            <img *ngIf="producto.imagen" [src]="backendURL + producto.imagen" alt="foto" width="50" />
          </td>
          <td>
            <button class="petly-accion eliminar" (click)="eliminarProducto(producto.id)">🗑️</button>
            <button class="petly-accion editar" (click)="editarProducto(producto)">✏️</button>
          </td>
        </tr>
      </tbody>
    </table>

    <button (click)="mostrarFormularioAgregar()" class="petly-boton mt-4">Agregar producto</button>
  </div>
</div>

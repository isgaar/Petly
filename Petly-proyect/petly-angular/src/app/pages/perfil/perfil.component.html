<div class="petly-container">
  <h2 class="petly-titulo">Mi Perfil</h2>
  <p class="petly-subtexto">Hola, {{ nombreUsuario }}</p>

  <h3 class="petly-subtitulo mt-4">Pagos realizados</h3>

  <div *ngIf="pagos.length === 0">
    <p>No has realizado pagos aún.</p>
  </div>

  <table class="petly-tabla" *ngIf="pagos.length > 0">
    <thead>
      <tr>
        <th>Referencia</th>
        <th>Total</th>
        <th>Fecha</th>
        <th>Comprobante</th>
        <th>Estatus</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pago of pagos">
        <td>{{ pago.referencia }}</td>
        <td>${{ pago.total }}</td>
        <td>{{ pago.fecha_creacion | date:'short' }}</td>
        <td>
          <a *ngIf="pago.comprobante" [href]="'http://localhost:3000' + pago.comprobante" target="_blank">Ver</a>
          <span *ngIf="!pago.comprobante">No enviado</span>
        </td>
        <td>{{ pago.estatus }}</td>
      </tr>
    </tbody>
  </table>
</div>
